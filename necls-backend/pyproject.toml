[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["necls_backend"]

[tool.setuptools.package-data]
necls_backend = ["py.typed"]

[project]
name = "necls-backend"
version = "1.3.9"
description = "News Extract Clustering LLM Summarization - Backend"
requires-python = ">=3.10"
dependencies = [
   "beautifulsoup4",
    "boto3",
    "bs4",
    "feedparser",
    "google-genai",
    "langchain-core",
    "langchain-openai",
    "news-please",
    "numpy",
    "pandas",
    "pgvector",
    "psycopg2-binary",
    "pydantic",
    "python-dateutil",
    "requests",
    "schedule",
    "scikit-learn",
    "fastembed",
    "sqlalchemy",
    "tls-client",
    "flask",
    "flask-login",
]

[project.scripts]
extract-articles = "necls_backend.scripts.extract_articles:cli"
cluster-articles = "necls_backend.scripts.cluster_articles:cli"